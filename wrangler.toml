name = "xugou-app"
main = "backend/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

minify = true # 生产环境压缩代码

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
persist = true

# 添加定时触发器，每分钟执行一次监控检查
[triggers]
crons = ["* * * * *"]

[vars]
# 管理会话和 Agent 凭据密钥分别使用以下命令配置，值不进入本文件：
# `wrangler secret put SESSION_HMAC_SECRET`
# `wrangler secret put ADMIN_INITIAL_PASSWORD`（仅全新数据库首次创建管理员时读取）
# `wrangler secret put AGENT_TOKEN_PEPPER`
# `wrangler secret put NOTIFICATION_KEK`
# KEK 轮换窗口另配置 `NOTIFICATION_KEK_PREVIOUS`，回填完成后删除旧 Secret。
FREE_MODE = "true"
# 前端默认与 API 同源。确需独立管理域名时使用逗号分隔的完整 Origin；
# 凭据化 CORS 忽略 `*`，避免把 HttpOnly 管理会话暴露给任意站点。
# ALLOWED_ORIGINS = "https://console.example.com"

AGENT_ENROLLMENT_TTL_MINUTES = "30"
NOTIFICATION_KEK_VERSION = "1"
NOTIFICATION_KEK_ROTATION_ENABLED = "false"
MIN_MONITOR_INTERVAL_SECONDS = "300"
MONITOR_CHECK_BATCH_SIZE = "100"
MONITOR_SCHEDULER_TIME_BUDGET_MS = "5000"
AGENT_OFFLINE_BATCH_SIZE = "50"
STATUS_PAGE_CACHE_TTL_SECONDS = "60"
PUBLIC_METRICS_CACHE_TTL_SECONDS = "120"
AGENT_ROLLUP_RETENTION_DAYS = "30"
MONITOR_ROLLUP_RETENTION_DAYS = "90"
AGENT_REPORT_RETENTION_DAYS = "30"
MONITOR_SAMPLE_RETENTION_DAYS = "90"
MONITOR_DAILY_ROLLUP_RETENTION_DAYS = "3650"
MONITOR_INCIDENT_RETENTION_DAYS = "180"
SECURITY_AUDIT_RETENTION_DAYS = "180"
STATUS_PUBLICATION_RETENTION_DAYS = "7"
PROCESSED_EVENT_RETENTION_DAYS = "30"
NOTIFICATION_EVENT_RETENTION_DAYS = "90"
# 最新探针版本号（如 "1.2.0"）。留空则不触发探针自升级；
# 填写后，开启了「自动升级」的 agent 上报版本低于此值时，
# 服务端会在配置下发响应中附加 update=1 触发探针自升级。
LATEST_AGENT_VERSION = "v1.2.6"

[[d1_databases]]
binding = "DB"
database_name = "${D1_DATABASE_NAME}" # 使用占位符
database_id = "${D1_DATABASE_ID}" # 使用占位符
migrations_table = "migrations"
migrations_dir = "backend/drizzle"

# Queue 只承载状态变化、通知和合并后的状态页重建等低频 Outbox。
[[queues.producers]]
binding = "XUGOU_JOBS"
queue = "xugou-jobs"

[[queues.consumers]]
queue = "xugou-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "xugou-jobs-dlq"

# DLQ 由同一 Worker 做最终日志记录并确认，避免失败消息长期堆积。
[[queues.consumers]]
queue = "xugou-jobs-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 0

# 当前实时链路：同一 Worker Bundle 内按 Agent ID 稳定哈希的 WebSocket 分片房间；
# Dashboard 每个分片复用一条连接，实时推送不经过 Queue。
[[durable_objects.bindings]]
name = "AGENT_ROOM"
class_name = "AgentRoom"

# 使用 SQLite-backed DO 以兼容免费计划
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AgentRoom"]

# 全局广播已由 AgentRoom 分片完整替代；该空间只包含可丢失实时缓存。
[[migrations]]
tag = "v3"
deleted_classes = ["MetricsBroadcaster"]

[assets]
binding = "ASSETS"
directory = "frontend/dist"
not_found_handling = "single-page-application"

[version_metadata]
binding = "CF_VERSION_METADATA"
