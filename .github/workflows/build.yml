name: Build and Publish Agent

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "发布到 latest 的 SemVer"
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      build_date: ${{ steps.release.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=12 HEAD)"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="$INPUT_VERSION"
          fi
          version="${version#v}"
          node -e 'const v=process.argv[1],m=/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(v);if(!m||m[4]?.split(".").some(x=>/^\d+$/.test(x)&&x.length>1&&x.startsWith("0")))process.exit(1)' "$version"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: agent/go.sum
      - name: Go quality and vulnerability gates
        working-directory: agent
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          ./scripts/smoke-test.sh
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  windows-update-integration:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: agent/go.sum
      - name: Exercise Windows self-management and rollback tests
        working-directory: agent
        run: go test ./pkg/selfmgmt ./cmd/agent

  build:
    needs: [metadata, verify, windows-update-integration]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: xugou-agent-linux-amd64
          - goos: linux
            goarch: arm64
            name: xugou-agent-linux-arm64
          - goos: darwin
            goarch: amd64
            name: xugou-agent-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: xugou-agent-darwin-arm64
          - goos: windows
            goarch: amd64
            name: xugou-agent-windows-amd64.exe
          - goos: windows
            goarch: arm64
            name: xugou-agent-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: agent/go.sum
      - name: Validate embedded update public key
        env:
          UPDATE_PUBLIC_KEY: ${{ secrets.AGENT_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$UPDATE_PUBLIC_KEY"
          test "$(printf '%s' "$UPDATE_PUBLIC_KEY" | base64 --decode | wc -c | tr -d ' ')" = 32
      - name: Build
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT_HASH: ${{ needs.metadata.outputs.commit }}
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          UPDATE_PUBLIC_KEY: ${{ secrets.AGENT_UPDATE_PUBLIC_KEY }}
        run: |
          go build -trimpath -tags netgo,osusergo \
            -ldflags="-s -w -X github.com/xugou/agent/cmd/agent.Version=${VERSION} -X github.com/xugou/agent/cmd/agent.GitCommit=${COMMIT_HASH} -X github.com/xugou/agent/cmd/agent.BuildDate=${BUILD_DATE} -X github.com/xugou/agent/cmd/agent.UpdatePublicKey=${UPDATE_PUBLIC_KEY}" \
            -o "dist/${{ matrix.name }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: agent/dist/${{ matrix.name }}
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    environment: agent-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate and sign latest manifest
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          UPDATE_PRIVATE_KEY_B64: ${{ secrets.AGENT_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$UPDATE_PRIVATE_KEY_B64"
          mkdir -p release-metadata
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          version=os.environ['VERSION']; base='https://dl.xugou.mdzz.uk/latest'
          items=[]
          for p in sorted(Path('artifacts').iterdir()):
            if not p.is_file() or not p.name.startswith('xugou-agent-'): continue
            suffix=p.name.removeprefix('xugou-agent-').removesuffix('.exe')
            goos,arch=suffix.split('-',1); data=p.read_bytes()
            items.append({'os':goos,'arch':arch,'url':f'{base}/{p.name}','size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          if len(items)!=6: raise SystemExit(f'expected 6 artifacts, found {len(items)}')
          manifest={'schema_version':1,'version':version,'artifacts':items,'released_at':os.environ['BUILD_DATE']}
          raw=json.dumps(manifest,separators=(',',':')).encode()
          Path('release-metadata/manifest.payload.json').write_bytes(raw)
          PY
          printf '%s' "$UPDATE_PRIVATE_KEY_B64" | base64 --decode > release-metadata/key.pem
          openssl pkeyutl -sign -rawin -inkey release-metadata/key.pem -in release-metadata/manifest.payload.json -out release-metadata/manifest.sig.bin
          base64 -w 0 release-metadata/manifest.sig.bin > release-metadata/manifest.sig
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          payload=Path('release-metadata/manifest.payload.json').read_bytes()
          signature=Path('release-metadata/manifest.sig').read_text()
          envelope={'schema_version':1,'payload_base64':base64.b64encode(payload).decode(),'signature':signature}
          Path('release-metadata/manifest.json').write_text(json.dumps(envelope,separators=(',',':')))
          PY
          shred -u release-metadata/key.pem
      - name: Publish latest objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          publish_mutable() {
            local file="$1" key="$2" size sha remote_size remote_sha remote_meta_size remote_etag second_etag
            size="$(wc -c < "$file" | tr -d ' ')"; sha="$(sha256sum "$file" | cut -d' ' -f1)"
            aws s3 cp "$file" "s3://${R2_BUCKET}/${key}" --endpoint-url "$endpoint" --no-progress --metadata "sha256=${sha},size=${size}"
            read -r remote_size remote_sha remote_meta_size remote_etag < <(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$endpoint" --query '[ContentLength,Metadata.sha256,Metadata.size,ETag]' --output text)
            second_etag="$(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$endpoint" --query 'ETag' --output text)"
            [[ "$remote_size" == "$size" && "$remote_sha" == "$sha" && "$remote_meta_size" == "$size" ]]
            [[ -n "$remote_etag" && "$remote_etag" != None && "$second_etag" == "$remote_etag" ]]
          }
          # 先更新全部二进制，最后原子切换内嵌签名的单对象清单。
          for file in artifacts/xugou-agent-*; do publish_mutable "$file" "latest/$(basename "$file")"; done
          publish_mutable release-metadata/manifest.json latest/manifest.json
