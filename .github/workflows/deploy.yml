name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.26.5"

jobs:
  deploy:
    name: Verify, migrate, deploy and verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.XUGOU_CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.XUGOU_CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.XUGOU_D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.XUGOU_D1_DATABASE_NAME }}
          RELEASE_READINESS_URL: ${{ secrets.RELEASE_READINESS_URL }}
          RELEASE_READINESS_TOKEN: ${{ secrets.RELEASE_READINESS_TOKEN }}
        run: |
          set -euo pipefail
          for value in CF_API_TOKEN CF_ACCOUNT_ID D1_DATABASE_ID D1_DATABASE_NAME RELEASE_READINESS_URL RELEASE_READINESS_TOKEN; do
            test -n "${!value}"
          done
      - name: Configure Wrangler
        env:
          D1_DATABASE_ID: ${{ secrets.XUGOU_D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.XUGOU_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          umask 077
          pnpm --dir backend wrangler:render-config -- \
            --template ../wrangler.toml \
            --output ../.wrangler.production.toml
      - name: Install browser runtime
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Unified quality gates
        run: pnpm run test:all
      - name: Verify reproducible Git input
        run: test -z "$(git status --porcelain)"
      - name: Verify archive bucket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.XUGOU_CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.XUGOU_CF_API_TOKEN }}
        run: pnpm exec wrangler r2 bucket info xugou-raw-sample-archive -c .wrangler.production.toml

      # Stage 1: preflight and point-in-time evidence.
      - name: Stage 1 - D1 preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.XUGOU_CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.XUGOU_CF_API_TOKEN }}
          D1_DATABASE_NAME: ${{ secrets.XUGOU_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 .migration-evidence
          pnpm exec wrangler d1 time-travel info "$D1_DATABASE_NAME" --json -c .wrangler.production.toml > .migration-evidence/pre-bookmark.json
          pnpm exec wrangler d1 export "$D1_DATABASE_NAME" --remote --output=.migration-evidence/pre.sql -c .wrangler.production.toml
          KEK_VERSION="$(sed -n 's/^NOTIFICATION_KEK_VERSION = "\([0-9][0-9]*\)"/\1/p' wrangler.toml | head -n 1)"
          pnpm --dir backend migration:preflight -- --sql-export ../.migration-evidence/pre.sql --allow-empty --notification-kek-version "$KEK_VERSION" > .migration-evidence/preflight.json

      # Stage 2: apply all D1 migrations.
      - name: Stage 2 - Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.XUGOU_CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.XUGOU_CF_API_TOKEN }}
          D1_DATABASE_NAME: ${{ secrets.XUGOU_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          umask 077
          pnpm exec wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote -c .wrangler.production.toml | tee .migration-evidence/migration-result.txt

      # Stage 3: re-export and prove integrity/conservation before Worker traffic changes.
      - name: Stage 3 - D1 postflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.XUGOU_CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.XUGOU_CF_API_TOKEN }}
          D1_DATABASE_NAME: ${{ secrets.XUGOU_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          umask 077
          pnpm exec wrangler d1 time-travel info "$D1_DATABASE_NAME" --json -c .wrangler.production.toml > .migration-evidence/post-bookmark.json
          pnpm exec wrangler d1 export "$D1_DATABASE_NAME" --remote --output=.migration-evidence/post.sql -c .wrangler.production.toml
          KEK_VERSION="$(sed -n 's/^NOTIFICATION_KEK_VERSION = "\([0-9][0-9]*\)"/\1/p' wrangler.toml | head -n 1)"
          pnpm --dir backend migration:preflight -- --sql-export ../.migration-evidence/post.sql --allow-empty --notification-kek-version "$KEK_VERSION" > .migration-evidence/post-preflight.json
          pnpm --dir backend migration:postflight -- --mode expand --before ../.migration-evidence/preflight.json --after ../.migration-evidence/post-preflight.json --output ../.migration-evidence/postflight.json
          pnpm --dir backend migration:manifest -- \
            --preflight ../.migration-evidence/preflight.json \
            --sql-export ../.migration-evidence/pre.sql \
            --bookmark ../.migration-evidence/pre-bookmark.json \
            --migration-result ../.migration-evidence/migration-result.txt \
            --postflight ../.migration-evidence/postflight.json \
            --post-sql-export ../.migration-evidence/post.sql \
            --post-bookmark ../.migration-evidence/post-bookmark.json \
            --git-sha "${{ github.sha }}" \
            --output ../.migration-evidence/migration-manifest.json

      # Stage 4: deploy only after postflight has passed.
      - name: Stage 4 - Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.XUGOU_CF_API_TOKEN }}
          accountId: ${{ secrets.XUGOU_CF_ACCOUNT_ID }}
          command: deploy --config .wrangler.production.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.XUGOU_CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.XUGOU_CF_API_TOKEN }}

      # Stage 5: protected runtime readiness is the final release gate.
      - name: Stage 5 - Protected release readiness
        env:
          RELEASE_READINESS_URL: ${{ secrets.RELEASE_READINESS_URL }}
          RELEASE_READINESS_TOKEN: ${{ secrets.RELEASE_READINESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          ready=0
          # 首次 Expand 发布需要等待 Cron 完成幂等 Backfill；普通发布通常首轮通过。
          # 每轮都覆盖为最新完整 JSON，超时失败时仍上传最后一次门禁证据。
          for attempt in $(seq 1 75); do
            curl --fail-with-body --retry 5 --retry-all-errors \
              --user-agent "xugou-release-readiness/1" \
              -H "Authorization: Bearer ${RELEASE_READINESS_TOKEN}" \
              "${RELEASE_READINESS_URL%/}/api/v2/operations/release-readiness" \
              > .migration-evidence/release-readiness.json
            if pnpm --dir backend exec tsx \
              tooling/operations/verify-release-readiness.ts \
              --file ../.migration-evidence/release-readiness.json \
              --mode release \
              > .migration-evidence/readiness-verification.json; then
              ready=1
              break
            fi
            if [ "$attempt" -lt 75 ]; then sleep 60; fi
          done
          test "$ready" -eq 1

      - name: Upload complete migration and readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-readiness-evidence-${{ github.sha }}
          retention-days: 90
          if-no-files-found: ignore
          path: .migration-evidence/
