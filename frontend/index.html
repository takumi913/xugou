<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- 移除了 manifest 链接，插件会自动注入 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <title>XUGOU - 轻量化监控平台</title>
    <!-- 首帧防闪烁：在 React 挂载前按明暗偏好挂 .light 类、按主题选择挂
         data-theme（逻辑与 ThemeProvider 保持一致；未知/非法主题 id 由
         CSS 兜底变量回退默认主题） -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme_preference");
          var preference =
            stored === "dark" || stored === "light" || stored === "auto"
              ? stored
              : "auto";
          var light =
            preference === "light" ||
            (preference === "auto" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.classList.add("light");

          var themeId = localStorage.getItem("theme_id");
          document.documentElement.setAttribute(
            "data-theme",
            themeId && /^[a-z0-9][a-z0-9-]{0,31}$/.test(themeId)
              ? themeId
              : "mono"
          );
        } catch (e) {
          /* localStorage 不可用时保持默认深色 + 默认主题 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
